name: Update Now Playing

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch currently playing track
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFYCLIENTID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFYCLIENTSECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFYREFRESHTOKEN }}
        run: node scripts/fetch-now-playing.js

      - name: Commit updated now-playing.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update now playing'
          file_pattern: now-playing.json
